#
# Shale performance: every bit of CPU headroom the machine allows.
# Selected by tuned-ppd as "performance".
#

[main]
summary=Shale performance: maximum CPU headroom

[cpu]
governor=performance
energy_performance_preference=performance
energy_perf_bias=performance
max_perf_pct=100
boost=1

[acpi]
# Firmware platform profile (e.g. ASUS/Lenovo/HP laptops): highest power limits and
# fan curve. TuneD skips this on machines without /sys/firmware/acpi/platform_profile.
platform_profile=performance

# Optional, NVIDIA laptops with Dynamic Boost only: uncomment to run nvidia-powerd in
# this profile (it shifts spare CPU power to the GPU on AC). TuneD stops it again when
# another profile is selected. Leave it commented if the service is not installed.
# [service]
# service.nvidia-powerd=start

[audio]
# Keep the codec awake to avoid wake-up latency and pops.
timeout=0

[scsi_host]
alpm=max_performance

[disk]
readahead=>4096

[sysctl]
kernel.nmi_watchdog=0
vm.swappiness=10
