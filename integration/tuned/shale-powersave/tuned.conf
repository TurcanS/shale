#
# Shale power saver: longest battery life while the desktop stays smooth.
# Selected by tuned-ppd as "power-saver". Written for intel_pstate (HWP) laptops;
# options a machine does not support (platform profile, EPP) are skipped by TuneD.
#

[main]
summary=Shale power saver: longest battery life, smooth desktop

[cpu]
# intel_pstate's "powersave" is its dynamic HWP governor, not a fixed low clock.
governor=powersave
energy_performance_preference=power
energy_perf_bias=power
# No turbo: cores stay at or below base clock. That is ample for desktop work and
# avoids the least efficient part of the curve.
boost=0

[acpi]
# Firmware platform profile: lower power limits and a quieter fan curve where supported.
platform_profile=low-power|quiet

[audio]
timeout=10

[scsi_host]
alpm=med_power_with_dipm

[usb]
autosuspend=1

[sysctl]
kernel.nmi_watchdog=0
vm.dirty_writeback_centisecs=1500
