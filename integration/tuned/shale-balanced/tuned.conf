#
# Shale balanced on AC power: full turbo on demand, idles efficiently.
# Selected by tuned-ppd as "balanced"; shale-balanced-battery replaces it on battery.
#

[main]
summary=Shale balanced: responsive on demand, efficient at idle

[cpu]
governor=powersave
energy_performance_preference=balance_performance
energy_perf_bias=normal
boost=1

[acpi]
platform_profile=balanced

[audio]
timeout=10

[scsi_host]
alpm=med_power_with_dipm

[usb]
autosuspend=1

[sysctl]
kernel.nmi_watchdog=0
