# Graphite, kitty in Shale's colours: charcoal surfaces, soft white text, muted semantic colours.
# Shale's installer writes this only where there was no kitty.conf yet. It is yours now: change anything, and later
# installs leave it alone.
font_family Adwaita Mono
font_size 11.0
background #101010
foreground #d4d4d4
background_opacity 1.0
cursor #c6c6c6
cursor_text_color #101010
selection_background #454545
selection_foreground #ffffff
window_padding_width 12
hide_window_decorations yes
enable_audio_bell no
scrollback_lines 10000
tab_bar_style separator
tab_bar_min_tabs 2
active_tab_background #333333
active_tab_foreground #ffffff
inactive_tab_background #171717
inactive_tab_foreground #999999
color0 #202020
color1 #c48a8a
color2 #a3b89b
color3 #c5b897
color4 #98aabd
color5 #b3a0b9
color6 #96b5b4
color7 #cccccc
color8 #707070
color9 #d8a0a0
color10 #b5c9ac
color11 #d8cbaa
color12 #acbed1
color13 #c7b3cd
color14 #abc9c8
color15 #eeeeee
