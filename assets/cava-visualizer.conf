# Now playing visualizer: raw bar heights (0-1000) on stdout, one frame per line.
[general]
framerate = 60
bars = 32
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 77
monstercat = 0
waves = 0
